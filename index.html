<style>
:root{
  --ground:#F3F5F0; --surface:#FFFFFF; --sunk:#EBEFE8; --ink:#1A221C; --muted:#5B675E; --line:#DAE0D6;
  --accent:#2F6B45; --accent-ink:#FFFFFF; --accent-soft:#E1ECE3;
  --p:#B94E33; --k:#2C6FAE; --y:#B27A0E; --star:#C28A0A;
  --ok:#2F6B45; --ok-bg:#E1ECE3; --warn:#7A5200; --warn-bg:#FAEFD6; --crit:#A23A26; --crit-bg:#F8E3DD; --info:#2C5F8A; --info-bg:#E2ECF5;
  --display:"Bricolage Grotesque","Noto Sans Arabic","Trebuchet MS",system-ui,sans-serif;
  --body:"Figtree","Noto Sans Arabic",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --ground:#111612; --surface:#1A211C; --sunk:#151B17; --ink:#E6ECE6; --muted:#98A59B; --line:#2B352E;
    --accent:#7CC495; --accent-ink:#0D1810; --accent-soft:#1F3026;
    --p:#DB6E50; --k:#4E93D6; --y:#C99A2E; --star:#E3B64A;
    --ok:#7CC495; --ok-bg:#1F3026; --warn:#E6C27A; --warn-bg:#2E2613; --crit:#EE9A86; --crit-bg:#34201B; --info:#8DBBE3; --info-bg:#1A2733;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --ground:#111612; --surface:#1A211C; --sunk:#151B17; --ink:#E6ECE6; --muted:#98A59B; --line:#2B352E;
  --accent:#7CC495; --accent-ink:#0D1810; --accent-soft:#1F3026;
  --p:#DB6E50; --k:#4E93D6; --y:#C99A2E; --star:#E3B64A;
  --ok:#7CC495; --ok-bg:#1F3026; --warn:#E6C27A; --warn-bg:#2E2613; --crit:#EE9A86; --crit-bg:#34201B; --info:#8DBBE3; --info-bg:#1A2733;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--ground);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5;padding:0 16px}
.app{max-width:600px;margin:0 auto;padding-block:16px calc(96px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px}
h1,h2,h3{font-family:var(--display);margin:0;line-height:1.15;text-wrap:balance}
h1{font-weight:800;font-size:28px;letter-spacing:-.02em}
h2{font-weight:600;font-size:19px}
h3{font-weight:600;font-size:16px}
:lang(ar) h1{letter-spacing:0}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.top .sub{color:var(--muted);font-size:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:12px}
.muted{color:var(--muted)} .small{font-size:13px}
.banner{background:var(--info-bg);color:var(--info);border-radius:14px;padding:12px 14px;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;font-size:14px}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:6;background:var(--ink);color:var(--ground);width:max-content;max-width:calc(100% - 32px)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.between{justify-content:space-between}
.grow{flex:1 1 140px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font:600 15px var(--body);padding:11px 16px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;text-decoration:none}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.sm{padding:7px 12px;font-size:14px;border-radius:10px}
.btn.ghost{background:transparent;border-color:transparent;color:var(--accent);padding-inline:6px}
.btn.danger{color:var(--crit);border-color:var(--crit-bg)}
.btn:disabled{opacity:.5;cursor:not-allowed}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,label.btn:focus-within{outline:3px solid color-mix(in srgb,var(--accent) 45%,transparent);outline-offset:2px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted);font-weight:500}
input[type=number],input[type=text],input[type=date],select,textarea{font:16px var(--body);color:var(--ink);background:var(--sunk);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%}
textarea{resize:vertical;min-height:70px}
input[type=file]{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:3px 9px;border-radius:99px}

/* Today */
.daynav{display:flex;align-items:center;gap:6px}
.iconbtn{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);display:grid;place-items:center;cursor:pointer;padding:0}
.iconbtn:disabled{opacity:.35;cursor:default}
:root[dir="rtl"] .iconbtn svg.flip{transform:scaleX(-1)}
.streak{background:var(--warn-bg);color:var(--warn)}
.kcal{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.big{font-family:var(--display);font-weight:800;font-size:46px;line-height:1;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.meter{height:10px;border-radius:99px;background:var(--sunk);overflow:hidden;position:relative}
.meter i{position:absolute;inset-inline-start:0;top:0;bottom:0;border-radius:99px;background:var(--c,var(--accent))}
.meter.over i{background:var(--crit)}
.macros{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.mac{display:flex;flex-direction:column;gap:5px;min-width:0}
.mac .lb{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px;font-weight:600}
.mac .lb::before{content:"";width:9px;height:9px;border-radius:3px;background:var(--c);flex:none}
.mac .v{font-weight:700;font-variant-numeric:tabular-nums;font-size:15px}
.mac .v span{color:var(--muted);font-weight:500;font-size:13px}
.alerts{display:flex;flex-direction:column;gap:8px}
.al{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;padding:10px 12px;border-radius:12px;font-size:14px}
.al b{font-size:11px;letter-spacing:.07em;text-transform:uppercase;align-self:center}
:lang(ar) .al b{letter-spacing:0}
.al > span{grid-row:1/3;margin-top:2px;display:flex}
.al.ok{background:var(--ok-bg);color:var(--ok)} .al.warn{background:var(--warn-bg);color:var(--warn)} .al.crit{background:var(--crit-bg);color:var(--crit)} .al.info{background:var(--info-bg);color:var(--info)}
.al p{margin:0;grid-column:2;color:var(--ink)}
.water{display:flex;gap:6px;flex-wrap:wrap}
.glass{width:34px;height:42px;border-radius:6px 6px 10px 10px;border:2px solid var(--k);background:transparent;cursor:pointer;padding:0}
.glass.on{background:linear-gradient(to top,var(--k) 75%,transparent 75%)}
.fast{display:flex;flex-direction:column;gap:10px}
.fasttime{font-family:var(--display);font-size:20px;font-variant-numeric:tabular-nums}
.meal{display:flex;flex-direction:column;gap:2px}
.meal-h{display:flex;justify-content:space-between;align-items:center;gap:8px;border-bottom:1px solid var(--line);padding-bottom:6px;margin-top:6px;flex-wrap:wrap}
.meal-h h3{font-size:15px}
.meal-h .acts{display:flex;align-items:center;gap:4px}
.it{display:grid;grid-template-columns:1fr auto auto;gap:0 10px;align-items:center;padding:7px 0}
.it .n{font-weight:600;min-width:0;overflow-wrap:anywhere}
.it .m{grid-column:1;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.it .k{grid-row:1/3;grid-column:2;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.x{grid-row:1/3;grid-column:3;width:30px;height:30px;border-radius:8px;border:1px solid var(--line);background:transparent;color:var(--muted);cursor:pointer;font-size:16px;line-height:1}
.empty{font-size:13px;color:var(--muted);padding:6px 0}

/* Add */
.seg{display:grid;grid-template-columns:repeat(3,1fr);background:var(--sunk);border-radius:12px;padding:4px;gap:4px}
.seg button{border:0;background:transparent;font:600 14px var(--body);color:var(--muted);padding:9px 4px;border-radius:9px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgb(0 0 0 / .08)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:99px;padding:7px 12px;font:500 14px var(--body);cursor:pointer}
.chip small{color:var(--muted)}
.frame{position:relative;aspect-ratio:4/3;max-width:100%;border-radius:12px;overflow:hidden;background:var(--sunk);display:grid;place-items:center;color:var(--muted);text-align:center;font-size:14px;padding:16px}
.frame img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.scan{position:absolute;inset:0;background:linear-gradient(180deg,transparent,color-mix(in srgb,var(--accent) 40%,transparent),transparent);background-size:100% 40%;background-repeat:no-repeat;animation:scan 1.6s ease-in-out infinite}
@keyframes scan{0%{background-position:0 -40%}100%{background-position:0 140%}}
.res .it{grid-template-columns:1fr auto}
.stepper{grid-column:2;grid-row:1/3;display:flex;align-items:center;gap:4px}
.step{width:30px;height:30px;border-radius:8px;border:1px solid var(--line);background:var(--sunk);color:var(--ink);font:600 17px var(--body);cursor:pointer;line-height:1}
.stepper output{min-width:40px;text-align:center;font-size:13px;font-weight:600;font-variant-numeric:tabular-nums}
.status{font-size:14px;color:var(--muted);min-height:1.2em}
.status.err{color:var(--crit)}
.fl{display:flex;flex-direction:column}
.fr{display:grid;grid-template-columns:auto 1fr auto;gap:0 10px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.fr:first-child{border-top:0}
.fr .n{font-weight:600;min-width:0;overflow-wrap:anywhere}
.fr .m{grid-column:2;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.fr .star{grid-row:1/3;width:32px;height:32px;border:0;background:transparent;color:var(--muted);cursor:pointer;display:grid;place-items:center;border-radius:8px}
.fr .star[aria-pressed="true"]{color:var(--star)}
.fr .addb{grid-row:1/3;grid-column:3}

/* Progress */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px}
.stat{background:var(--sunk);border-radius:12px;padding:10px 12px}
.stat small{display:block;font-size:12px;color:var(--muted);font-weight:600}
.stat strong{font-size:20px;font-variant-numeric:tabular-nums;font-family:var(--display)}
.eta{background:var(--accent-soft);color:var(--ink);border-radius:12px;padding:10px 12px;font-size:14px;display:flex;flex-direction:column;gap:2px}
.chart{position:relative;direction:ltr}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .ax{fill:var(--muted);font:11px var(--body)}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--ground);font-size:12px;padding:5px 8px;border-radius:8px;white-space:nowrap;transform:translate(-50%,-120%)}
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px;font-variant-numeric:tabular-nums}
th,td{text-align:end;padding:7px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
th:first-child,td:first-child{text-align:start}
th{font-size:12px;color:var(--muted);font-weight:600}

/* Coach */
.answer{white-space:pre-wrap;background:var(--sunk);border-radius:12px;padding:12px 14px;font-size:15px}
.summary{font:13px/1.45 ui-monospace,SFMono-Regular,Menlo,monospace;min-height:200px;background:var(--sunk)}
:lang(ar) .summary{font-family:var(--body)}

/* Tabs */
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center;z-index:5}
nav.tabs .in{display:grid;grid-template-columns:repeat(5,1fr);width:100%;max-width:600px}
nav.tabs button{border:0;background:transparent;color:var(--muted);font:600 11px var(--body);display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;cursor:pointer;border-radius:10px}
nav.tabs button[aria-current="page"]{color:var(--accent)}
nav.tabs button.add span.ic{background:var(--accent);color:var(--accent-ink);border-radius:12px;width:40px;height:30px;display:grid;place-items:center}
.confirm{background:var(--crit-bg);color:var(--crit);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px;font-size:14px}
footer{font-size:12px;color:var(--muted);text-align:center}
@media (prefers-reduced-motion:reduce){.scan{animation:none}}
</style>

const $=s=>document.querySelector(s);
function h(tag,attrs,...kids){
  const el=document.createElement(tag);
  for(const [k,v] of Object.entries(attrs||{})){
    if(v==null||v===false) continue;
    if(k==="class") el.className=v;
    else if(k==="html") el.innerHTML=v;
    else if(k.startsWith("on")) el.addEventListener(k.slice(2),v);
    else if(k==="style") el.style.cssText=v;
    else el.setAttribute(k,v===true?"":v);
  }
  for(const c of kids.flat()){ if(c==null||c===false) continue; el.append(c.nodeType?c:document.createTextNode(String(c))); }
  return el;
}

function currentKg(){ const ks=Object.keys(S.olcum).filter(k=>S.olcum[k].kg).sort(); return ks.length?S.olcum[ks[ks.length-1]].kg:S.profile?.kg; }
function minKcal(p){ return p.cinsiyet==="k"?1200:1500; }
function targets(){
  const p=S.profile; if(!p) return null;
  const kg=currentKg(), boyM=p.boy/100;
  const bmr=10*kg+6.25*p.boy-5*p.yas+(p.cinsiyet==="k"?-161:5);
  const tdee=bmr*({1:1.2,2:1.375,3:1.55,4:1.725}[p.aktivite]||1.375);
  const deficit=Math.round((p.tempo||0.5)*7700/7);
  let kcal=p.hedef==="ver"?tdee-deficit:p.hedef==="al"?tdee+250:tdee;
  const floor=Math.max(minKcal(p),p.hedef==="ver"?bmr:0);
  let floored=kcal<floor; kcal=Math.max(kcal,floor);
  if(p.kcalOverride){ kcal=p.kcalOverride; floored=false; }
  kcal=Math.round(kcal/10)*10;
  const bmi=kg/(boyM*boyM);
  const refKg=bmi>30?27*boyM*boyM:kg;            // obezitede proteini referans kiloya göre hesapla
  const protein=Math.round(refKg*({ver:1.6,koru:1.2,al:1.8}[p.hedef]||1.4));
  const yag=Math.round(kcal*0.28/9);
  const karb=Math.max(0,Math.round((kcal-protein*4-yag*9)/4));
  const su=Math.max(6,Math.round(kg*33/250));
  const adim={1:6000,2:7500,3:9000,4:10000}[p.aktivite]||7500;
  return {kcal,protein,karb,yag,su,adim,bmr:Math.round(bmr),tdee:Math.round(tdee),bmi,kg,floored,autoKcal:Math.round(Math.max(p.hedef==="ver"?tdee-deficit:p.hedef==="al"?tdee+250:tdee,floor)/10)*10};
}
function dayTotals(k){ const t={kalori:0,protein:0,karb:0,yag:0}; (S.days[k]?.meals||[]).forEach(m=>{t.kalori+=m.kalori;t.protein+=m.protein;t.karb+=m.karb;t.yag+=m.yag;}); return t; }
function bmiLabel(b){ return b<18.5?["bmi_under","warn"]:b<25?["bmi_normal","ok"]:b<30?["bmi_over","warn"]:["bmi_obese","crit"]; }
function streak(){ let k=today(); if(!S.days[k]?.meals?.length) k=addDays(k,-1); let n=0; while(S.days[k]?.meals?.length){ n++; k=addDays(k,-1); } return n; }
function weeklyRate(){   // kg/hafta (pozitif = kayıp), son ~3 hafta
  const ks=Object.keys(S.olcum).filter(x=>S.olcum[x].kg).sort(); if(ks.length<2) return null;
  const a=ks[ks.length-1], cutoff=addDays(a,-21); let b=ks[0]; for(const x of ks) if(x<=cutoff) b=x;
  if(a===b) return null;
  const weeks=Math.max(1,(dt(a)-dt(b))/6048e5); return (S.olcum[b].kg-S.olcum[a].kg)/weeks;
}
function alerts(){
  const T=targets(); if(!T) return [];
  const k=today(), tt=dayTotals(k), d=S.days[k]||{}, hour=new Date().getHours(), out=[];
  if(tt.protein>=T.protein*0.9) out.push(["ok",t("al_protein_ok",{a:r(tt.protein),b:T.protein})]);
  else if(hour>=14||tt.protein>0) out.push([hour>=18?"warn":"info",t("al_protein_left",{n:r(T.protein-tt.protein)})]);
  if(tt.kalori>T.kcal*1.1) out.push(["warn",t("al_over",{n:nf(tt.kalori-T.kcal)})]);
  else if(hour>=20&&tt.kalori>0&&tt.kalori<T.kcal*0.6) out.push(["warn",t("al_under",{n:nf(tt.kalori)})]);
  const su=d.su||0;
  if(su>=T.su) out.push(["ok",t("al_water_ok",{n:su})]);
  else if(hour>=15&&su<T.su/2) out.push(["warn",t("al_water_low",{n:su,g:T.su,v:fvol(T.su)})]);
  const adim=d.adim||0;
  if(adim>=T.adim) out.push(["ok",t("al_steps_ok",{n:nf(adim)})]);
  else { const kalan=T.adim-adim; out.push([hour>=19?"warn":"info",t("al_steps_left",{n:nf(kalan),m:Math.ceil(kalan/100)})]); }
  const rate=weeklyRate();
  if(rate!=null&&rate>currentKg()*0.01) out.push(["crit",t("al_rate",{n:fw(rate)})]);
  const ks=Object.keys(S.olcum).filter(x=>S.olcum[x].kg).sort();
  if(ks.length){ const last=ks[ks.length-1]; if(addDays(last,7)<=k) out.push(["info",t("al_weigh",{n:Math.round((dt(k)-dt(last))/864e5)})]); }
  if(T.floored) out.push(["info",t("al_floor")]);
  const order={crit:0,warn:1,info:2,ok:3};
  return out.sort((x,y)=>order[x[0]]-order[y[0]]);
}

function weightChart(){
  const ks=Object.keys(S.olcum).filter(k=>S.olcum[k].kg).sort().slice(-30);
  const wrap=h("div",{class:"chart"});
  if(ks.length<2){ wrap.append(h("p",{class:"muted small",style:"margin:0"},t("chart_need2"))); return wrap; }
  const W=360,H=190,Lm=34,R=8,Tp=12,B=24;
  const t0=dt(ks[0]).getTime(), t1=dt(ks[ks.length-1]).getTime();
  const vals=ks.map(k=>wv(S.olcum[k].kg)), hk=S.profile.hedefKg?wv(S.profile.hedefKg):null, span=imp()?13:6;
  let lo=Math.min(...vals), hi=Math.max(...vals);
  if(hk&&hk>=lo-span&&hk<=hi+span){ lo=Math.min(lo,hk); hi=Math.max(hi,hk); }
  lo=Math.floor(lo-0.5); hi=Math.ceil(hi+0.5);
  const step=Math.max(1,Math.ceil((hi-lo)/4)); hi=lo+step*Math.ceil((hi-lo)/step);
  const x=tm=>Lm+(W-Lm-R)*(t1===t0?0.5:(tm-t0)/(t1-t0)), y=v=>Tp+(H-Tp-B)*(1-(v-lo)/(hi-lo));
  const pts=ks.map((k,i)=>[x(dt(k).getTime()),y(vals[i]),k]);
  let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${t("chart_w")}">`;
  for(let v=lo;v<=hi;v+=step) s+=`<line class="grid" x1="${Lm}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}"/><text class="ax" x="${Lm-8}" y="${y(v)+4}" text-anchor="end">${nf(v)}</text>`;
  if(hk&&hk>=lo&&hk<=hi) s+=`<line x1="${Lm}" x2="${W-R}" y1="${y(hk)}" y2="${y(hk)}" stroke="var(--accent)" stroke-width="1.5" stroke-dasharray="5 5"/><text class="ax" x="${W-R}" y="${y(hk)-6}" text-anchor="end" style="fill:var(--accent);font-weight:600">${t("goal_x",{n:fw(S.profile.hedefKg)})}</text>`;

function kcalChart(){

  keys.forEach((k,i)=>{

const API="/api/ai";
function fileToB64(f){ return new Promise((res,rej)=>{ const img=new Image(); img.onload=()=>{ const sc=Math.min(1,1280/Math.max(img.width,img.height)); const c=document.createElement("canvas"); c.width=Math.round(img.width*sc); c.height=Math.round(img.height*sc); c.getContext("2d").drawImage(img,0,0,c.width,c.height); res(c.toDataURL("image/jpeg",0.85).split(",")[1]); }; img.onerror=()=>rej({code:"image_rejected"}); img.src=URL.createObjectURL(f); }); }
async function callAI(body,signal){
  let res; try{ res=await fetch(API,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body),signal}); }
  catch(e){ throw {code:e?.name==="AbortError"?"cancelled":"network",detail:"fetch: "+(e?.message||e)}; }
  let j=null, raw=""; try{ raw=await res.text(); j=JSON.parse(raw); }catch{}
  if(res.status===429||j?.error==="rate_limited") throw {code:"rate_limited",detail:j?.detail};
  if(j?.error==="image_rejected") throw {code:"image_rejected",detail:j?.detail};
  if(!res.ok||!j||j.error||typeof j.text!=="string") throw {code:"network",detail:j?.detail||("HTTP "+res.status+" "+raw.trim().slice(0,120))};
  return j;
}
function makeSample(){
  const s=async(messages,opts={})=>{ const out=await callAI({messages},opts.signal); opts.onText?.({text:out.text,delta:out.text}); return {text:out.text,truncated:false}; };
  s.json=async(prompt,opts={})=>{ const body={prompt,json:true}; if(opts.images) body.image=await fileToB64(opts.images); const out=await callAI(body); try{ const m=String(out.text).match(/\{[\s\S]*\}/); return JSON.parse(m?m[0]:out.text); }catch{ throw {code:"invalid_json"}; } };
  s.limits=async()=>({images:true});
  return s;
}
